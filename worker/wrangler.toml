name = "hyakka-kenten-api"
main = "src/index.js"
compatibility_date = "2025-10-01"
# workers.dev は残す（試作版のプレビュー用URLに使う）。workers.dev への普通のアクセスは hyakkakenten.com に転送する
workers_dev = true
preview_urls = true
# ゲームの画面・記事データ・画像も、このWorkerから配る（デプロイ時に public/ へ集める）
#   静的ファイルはWorkerを通さずに配る。Workerを通すのは、画面の入口（共有カードの書き換え）とAPIだけ
assets = { directory = "./public", binding = "ASSETS", run_worker_first = ["/", "/index.html", "/api/*", "/og/*", "/sitemap.xml"] }
routes = [
  { pattern = "hyakkakenten.com", custom_domain = true },
  { pattern = "www.hyakkakenten.com", custom_domain = true },
]

[vars]
DATA_BASE = "https://hyakkakenten.com/data/"
ALLOWED_ORIGINS = "https://hyakkakenten.com,https://y-krn.github.io,http://localhost:8765"

[[d1_databases]]
binding = "DB"
database_name = "hyakka-kenten"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# ボタンが押された回数（Workers Analytics Engine）。押されたボタンの名前・スマホかどうか・来た元の種類だけを書く。誰が押したかは書かない。3か月で自動的に消える
[[analytics_engine_datasets]]
binding = "EV"
dataset = "hyakka_ev"

# 毎晩の片付け（日本時間 3:17）。古い記録の番号やIPを消す（src/index.js の cleanup）
[triggers]
crons = ["17 18 * * *"]
