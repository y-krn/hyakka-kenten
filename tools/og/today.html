<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/dela-gothic-one/index.css">
<link rel="stylesheet" href="node_modules/@fontsource/zen-kaku-gothic-new/700.css">
<style>
html,body{margin:0}
:root{--ink:#111;--paper:#fff8e6;--blue:#2357ff;--red:#e0402b;--gold:#ffd84d}
.c{position:relative;width:1200px;height:630px;overflow:hidden;color:var(--ink);font-family:"Zen Kaku Gothic New",sans-serif;background:var(--gold)}
/* 集中線と網点 */
.rays{position:absolute;inset:-600px;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.55) 0 2.5deg,transparent 2.5deg 10deg)}
.dots{position:absolute;inset:0;background:radial-gradient(rgba(0,0,0,.13) 1.6px,transparent 1.8px) 0 0/14px 14px}
.top{position:absolute;left:40px;right:40px;top:26px;display:flex;align-items:center;gap:14px}
.top img{width:58px;height:58px;border-radius:12px;border:3px solid var(--ink)}
.top .ttl{font-family:"Dela Gothic One";font-size:46px;letter-spacing:.04em;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink)}
.top .dt{margin-left:auto;font-family:"Dela Gothic One";font-size:30px;background:var(--ink);color:var(--gold);padding:6px 18px;border-radius:8px;transform:rotate(2deg)}
.ring{position:absolute;left:40px;right:40px;top:112px;height:330px}
.side{position:absolute;top:0;width:520px;height:330px;box-sizing:border-box;padding:22px 30px 20px;display:flex;flex-direction:column;background:#fff;border:5px solid var(--ink);box-shadow:9px 9px 0 var(--ink)}
.side.a{left:0;clip-path:polygon(0 0,100% 0,92% 100%,0 100%);padding-right:66px}
.side.b{right:0;clip-path:polygon(8% 0,100% 0,100% 100%,0 100%);padding-left:66px}
.side.a{border-top:14px solid var(--blue)} .side.b{border-top:14px solid var(--red)}
.role{display:inline-block;align-self:flex-start;font-weight:700;font-size:20px;color:#fff;padding:3px 12px;border-radius:4px;letter-spacing:.08em}
.a .role{background:var(--blue)} .b .role{background:var(--red)}
.nm{font-family:"Dela Gothic One";line-height:1.12;margin:12px 0 6px;flex:1;display:flex;align-items:center;word-break:break-all}
.q{font-size:19px;font-weight:700;color:#444;line-height:1.35;height:52px;overflow:hidden}
.mv{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;height:36px;overflow:hidden}
.mv span{font-weight:700;font-size:17px;border:2.5px solid var(--ink);border-radius:5px;padding:2px 9px;background:#fff}
.a .mv span{background:#e4ebff} .b .mv span{background:#ffe5e0}
.vs{position:absolute;left:50%;top:50%;width:190px;height:190px;transform:translate(-50%,-52%) rotate(-8deg);z-index:2;display:flex;align-items:center;justify-content:center}
.vs::before{content:'';position:absolute;inset:0;background:var(--ink);clip-path:polygon(50% 0,61% 30%,95% 18%,72% 46%,100% 62%,66% 66%,72% 100%,50% 76%,26% 98%,30% 66%,0 62%,28% 46%,6% 16%,40% 30%)}
.vs::after{content:'';position:absolute;inset:14px;background:var(--gold);clip-path:polygon(50% 0,61% 30%,95% 18%,72% 46%,100% 62%,66% 66%,72% 100%,50% 76%,26% 98%,30% 66%,0 62%,28% 46%,6% 16%,40% 30%)}
.vs b{position:relative;z-index:1;font-family:"Dela Gothic One";font-size:58px;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink)}
.ask{position:absolute;left:40px;right:40px;bottom:46px;height:92px;display:flex;align-items:center;justify-content:center;gap:22px;background:var(--ink);color:#fff;border-radius:10px;transform:rotate(-1deg)}
.ask .h{font-family:"Dela Gothic One";font-size:48px;color:var(--gold);letter-spacing:.04em}
.ask .s{font-size:26px;font-weight:700}
.disc{position:absolute;left:44px;bottom:12px;font-size:15px;font-weight:700;color:rgba(0,0,0,.7)}
.url{position:absolute;right:44px;bottom:9px;font-family:"Dela Gothic One";font-size:20px;letter-spacing:.08em}
</style></head><body><div class="c" id="c"></div>
<script>
// 百科拳典 今日の一戦の共有画像（1200×630）。render_today.mjs が window.draw(組み合わせ) を呼んで撮影する
//   結果は載せない（共有を見た人に、予想してから観戦してもらうため）
window.draw=M=>{
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=d=>(+d.slice(5,7))+'月'+(+d.slice(8,10))+'日';
const side=(p,cls,role)=>`<div class="side ${cls}"><span class="role">${role}</span><div class="nm" data-fit>${esc(p.name)}</div>
  <div class="q">${esc(p.q||'')}</div><div class="mv">${(p.mv||[]).slice(0,4).map(m=>`<span>${esc(m)}</span>`).join('')}</div></div>`;
document.getElementById('c').innerHTML=`<div class="rays"></div><div class="dots"></div>
<div class="top"><img src="../../icon-512.png"><span class="ttl">今日の一戦</span><span class="dt">${md(M.day)}</span></div>
<div class="ring">${side(M.a,'a','人気の記事')}<div class="vs"><b>VS</b></div>${side(M.b,'b','挑戦者')}</div>
<div class="ask"><span class="h">どっちが勝つ？</span><span class="s">予想してから観戦しよう</span></div>
<div class="disc">※Wikipediaの記述をもとにした架空の試合です。実在の国・団体・人物の優劣を示すものではありません。</div>
<div class="url">hyakkakenten.com</div>`;
document.fonts.ready.then(()=>{
  document.querySelectorAll('[data-fit]').forEach(e=>{ let s=72; e.style.fontSize=s+'px'; const W=e.clientWidth;
    while(s>26&&(e.scrollWidth>W||e.scrollHeight>e.clientHeight)){ s-=2; e.style.fontSize=s+'px'; } });
  document.body.dataset.ready=1; }); };
</script></body></html>
