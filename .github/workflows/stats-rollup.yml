# 遊ばれ方の日ごとの合計を作る：Workers Analytics Engine の記録（3か月で消える）を、日ごとの合計にしてデータベース（daily_stats）に写す
#   誰のものかを結び付けられる値は、もともと記録にない。直近の日数分を毎回作り直す（何度動かしても同じ結果）
#   いまは手で動かすだけ（本番に出すときに、毎晩の定期実行を足す）
name: 遊ばれ方の日ごとの合計
on:
  workflow_dispatch:
    inputs:
      target:
        description: どちらに写すか
        type: choice
        options: [プレビュー, 本番]
        default: プレビュー
      days:
        description: 直近何日分を作り直すか
        default: '14'
permissions:
  contents: read
jobs:
  rollup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Analytics Engine から日ごとの合計を作る
        run: |
          if [ "${{ inputs.target }}" = "本番" ]; then echo "DB=hyakka-kenten" >> $GITHUB_ENV; DATASET=hyakka_ev; else echo "DB=hyakka-kenten-preview" >> $GITHUB_ENV; DATASET=hyakka_ev_preview; fi
          DATASET=$DATASET DAYS="${{ inputs.days }}" OUT=rollup.sql node tools/stats/rollup.mjs
      - name: データベースに写す
        working-directory: worker
        run: |
          npx wrangler d1 execute "$DB" --remote --file ../rollup.sql
          npx wrangler d1 execute "$DB" --remote --json --command "SELECT day, ev, SUM(n) AS n FROM daily_stats GROUP BY day, ev ORDER BY day DESC, ev LIMIT 60" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{ const r=JSON.parse(s)[0].results; console.log('CHJSON'+JSON.stringify(r)); })"
