# 本番のデータベースを読むだけ（何も変えない）：決まった確認用の問い合わせを実行して、結果を実行ログに出す
name: データベースを読む（確認用）
on:
  workflow_dispatch:
    inputs:
      what:
        description: 何を読むか
        type: choice
        options: [都道府県の応援, 遊び方の内訳, アクセス解析, 今日の記録, 王座戦の記録, 王座の交代, 読み取りの多い問い合わせ, ボタンの回数, ボタンの回数（プレビュー）]
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: worker
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: sed -i "s/REPLACE_WITH_D1_DATABASE_ID/${{ vars.D1_DATABASE_ID }}/" wrangler.toml
      - name: 都道府県の応援（効果の記録・県対抗の集計）
        if: inputs.what == '都道府県の応援'
        run: |
          npx wrangler d1 execute hyakka-kenten --remote --json --command "SELECT day, pref, k, n FROM pref_ev ORDER BY day, pref, k"
          npx wrangler d1 execute hyakka-kenten --remote --json --command "SELECT month, pref, w, l, c FROM pref_month ORDER BY month, pref"
      - name: 遊び方の内訳（週ごと。日本時間。王座戦以外の対戦と、王座戦の挑戦、開いたブラウザ）
        if: inputs.what == '遊び方の内訳'
        run: |
          npx wrangler d1 execute hyakka-kenten --remote --json --command "SELECT strftime('%Y-%W', datetime(at, '+9 hours')) AS wk, SUM(n) AS n, SUM(kt) AS t, SUM(km) AS m, SUM(kf) AS f, SUM(kd) AS d, COUNT(DISTINCT COALESCE(client, iphash)) AS u FROM plays WHERE at >= '2026-10-20' GROUP BY wk ORDER BY wk"
          npx wrangler d1 execute hyakka-kenten --remote --json --command "SELECT strftime('%Y-%W', datetime(at, '+9 hours')) AS wk, COUNT(*) AS ch, COUNT(DISTINCT COALESCE(client, iphash)) AS u FROM challenges WHERE result <> 'late' AND at >= '2026-10-20' GROUP BY wk ORDER BY wk"
          npx wrangler d1 execute hyakka-kenten --remote --json --command "SELECT strftime('%Y-%W', datetime(at, '+9 hours')) AS wk, COUNT(DISTINCT client) AS v, COUNT(DISTINCT CASE WHEN fresh = 1 THEN client END) AS nw FROM visits GROUP BY wk ORDER BY wk"
      - name: アクセス解析（日ごとの来訪・来た元・遊んだ割合・再訪・時間帯・遊んだ数の分布）
        if: inputs.what == 'アクセス解析'
        run: |
          npx wrangler d1 execute hyakka-kenten --remote --json --command "SELECT day, COUNT(*) AS v, SUM(fresh) AS nw, SUM(mob) AS mob, SUM(CASE WHEN ref IS NOT NULL THEN 1 ELSE 0 END) AS rf FROM visits GROUP BY day ORDER BY day"
          npx wrangler d1 execute hyakka-kenten --remote --json --command "SELECT COALESCE(ref, '(なし)') AS ref, COUNT(*) AS v, SUM(fresh) AS nw FROM visits GROUP BY ref ORDER BY v DESC LIMIT 25"
          npx wrangler d1 execute hyakka-kenten --remote --json --command "SELECT v.day, COUNT(*) AS v, SUM(CASE WHEN EXISTS (SELECT 1 FROM plays p WHERE p.client = v.client AND date(datetime(p.at, '+9 hours')) = v.day) THEN 1 ELSE 0 END) AS played, SUM(CASE WHEN v.fresh = 1 AND EXISTS (SELECT 1 FROM plays p WHERE p.client = v.client AND date(datetime(p.at, '+9 hours')) = v.day) THEN 1 ELSE 0 END) AS nw_played FROM visits v GROUP BY v.day ORDER BY v.day"
          npx wrangler d1 execute hyakka-kenten --remote --json --command "SELECT COALESCE(v.ref, '(なし)') AS ref, v.mob, COUNT(*) AS v, SUM(CASE WHEN EXISTS (SELECT 1 FROM plays p WHERE p.client = v.client AND date(datetime(p.at, '+9 hours')) = v.day) THEN 1 ELSE 0 END) AS played FROM visits v GROUP BY ref, v.mob ORDER BY v DESC LIMIT 20"
          npx wrangler d1 execute hyakka-kenten --remote --json --command "SELECT days, COUNT(*) AS clients FROM (SELECT client, COUNT(*) AS days FROM visits GROUP BY client) GROUP BY days ORDER BY days"
          npx wrangler d1 execute hyakka-kenten --remote --json --command "SELECT strftime('%H', datetime(at, '+9 hours')) AS h, COUNT(*) AS v FROM visits GROUP BY h ORDER BY h"
          npx wrangler d1 execute hyakka-kenten --remote --json --command "SELECT date(datetime(at, '+9 hours')) AS day, COUNT(*) AS sends, SUM(n) AS n, COUNT(DISTINCT client) AS c FROM plays WHERE at >= '2026-11-10' GROUP BY day ORDER BY day"
          npx wrangler d1 execute hyakka-kenten --remote --json --command "SELECT x.n AS battles, COUNT(*) AS clients FROM (SELECT client, SUM(n) AS n FROM plays WHERE client IS NOT NULL AND at >= '2026-11-15' GROUP BY client) x GROUP BY x.n ORDER BY x.n LIMIT 30"
      - name: 今日の記録（日本時間の今日の来訪と対戦を、1時間ごとの合計で。実行結果は誰でも見られるので、1件ずつは出さない）
        if: inputs.what == '今日の記録'
        run: |
          npx wrangler d1 execute hyakka-kenten --remote --json --command "SELECT strftime('%H', datetime(at, '+9 hours')) AS h, COUNT(*) AS v, SUM(mob) AS mob, SUM(fresh) AS nw, SUM(CASE WHEN ref IS NOT NULL THEN 1 ELSE 0 END) AS rf FROM visits WHERE day = date('now', '+9 hours') GROUP BY h ORDER BY h"
          npx wrangler d1 execute hyakka-kenten --remote --json --command "SELECT COALESCE(ref, '(なし)') AS ref, COALESCE(land, '(なし)') AS land, COUNT(*) AS v FROM visits WHERE day = date('now', '+9 hours') GROUP BY ref, land ORDER BY v DESC"
          npx wrangler d1 execute hyakka-kenten --remote --json --command "SELECT strftime('%H', datetime(at, '+9 hours')) AS h, SUM(n) AS n, SUM(kt) AS t, SUM(kd) AS d, SUM(kf) AS f, SUM(km) AS m FROM plays WHERE at >= datetime(date('now', '+9 hours'), '-9 hours') GROUP BY h ORDER BY h"
      - name: 王座の交代（日本時間の日ごと・時間帯ごとの交代の回数と、王者の在位時間。名前などは出さない）
        if: inputs.what == '王座の交代'
        run: |
          npx wrangler d1 execute hyakka-kenten --remote --json --command "SELECT date(started_at, '+9 hours') AS day, COUNT(*) AS n, SUM(CASE WHEN (julianday(COALESCE(ended_at, datetime('now'))) - julianday(started_at)) * 24 < 1 THEN 1 ELSE 0 END) AS under1h FROM reigns GROUP BY day ORDER BY day; SELECT id, started_at, ended_at, defenses FROM reigns ORDER BY id DESC LIMIT 40" > /tmp/rg.json
          node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/rg.json','utf8'));console.log('CHJSON'+JSON.stringify(j.map(x=>x.results)))"
      - name: 王座戦の記録（挑戦者・王者・結果。名前などは出さない）
        if: inputs.what == '王座戦の記録'
        run: |
          npx wrangler d1 execute hyakka-kenten --remote --json --command "SELECT c.id, c.title AS ch, r.title AS champ, c.result FROM challenges c JOIN reigns r ON r.id = c.reign_id WHERE c.result <> 'late' ORDER BY c.id" > /tmp/ch.json
          node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/ch.json','utf8'));console.log('CHJSON'+JSON.stringify(j[0].results))"
      - name: 読み取りの多い問い合わせ（直近1日と7日。D1 が記録している、問い合わせごとの読んだ行数）
        if: inputs.what == '読み取りの多い問い合わせ'
        run: |
          npx wrangler d1 insights hyakka-kenten --timePeriod=1d --sort-type=sum --sort-by=reads --limit=15 --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log('CHJSON'+JSON.stringify(j.map(x=>({q:x.query.slice(0,300),n:x.numberOfTimesRun,read:x.totalRowsRead,avg:x.avgRowsRead}))))})"
          npx wrangler d1 insights hyakka-kenten --timePeriod=7d --sort-type=sum --sort-by=reads --limit=15 --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log('CHJSON'+JSON.stringify(j.map(x=>({q:x.query.slice(0,300),n:x.numberOfTimesRun,read:x.totalRowsRead,avg:x.avgRowsRead}))))})"
      - name: ボタンの回数（直近7日。Workers Analytics Engine。名前・スマホかどうか・来た元の種類ごと）
        if: startsWith(inputs.what, 'ボタンの回数')
        run: |
          ds=hyakka_ev; [ "${{ inputs.what }}" = "ボタンの回数（プレビュー）" ] && ds=hyakka_ev_preview
          q="SELECT blob1 AS name, blob2 AS dev, blob3 AS src, SUM(_sample_interval * double1) AS n FROM $ds WHERE timestamp > NOW() - INTERVAL '7' DAY GROUP BY name, dev, src ORDER BY n DESC LIMIT 300 FORMAT JSON"
          curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/analytics_engine/sql" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --data "$q" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{ try{ const j=JSON.parse(s); console.log('CHJSON'+JSON.stringify(j.data||j)); }catch(e){ console.log('読めませんでした', s.slice(0,500)); } })"
