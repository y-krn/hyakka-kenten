# 本番のデータベースを読むだけ（何も変えない）：決まった確認用の問い合わせを実行して、結果を実行ログに出す
name: データベースを読む（確認用）
on:
  workflow_dispatch:
    inputs:
      what:
        description: 何を読むか
        type: choice
        options: [都道府県の応援, 遊び方の内訳, アクセス解析, 今日の記録, 王座戦の記録, 王座の交代, 読み取りの多い問い合わせ, 日ごとの合計の照合, 来た元の推移]
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: worker
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: sed -i "s/REPLACE_WITH_D1_DATABASE_ID/${{ vars.D1_DATABASE_ID }}/" wrangler.toml
      - name: 都道府県の応援（効果の記録・県対抗の集計）
        if: inputs.what == '都道府県の応援'
        run: |
          npx wrangler d1 execute hyakka-kenten --remote --json --command "SELECT day, pref, k, n FROM pref_ev ORDER BY day, pref, k"
          npx wrangler d1 execute hyakka-kenten --remote --json --command "SELECT month, pref, w, l, c FROM pref_month ORDER BY month, pref"
      - name: 遊び方の内訳（週ごと。日本時間。日ごとの合計から。王座戦以外の対戦と、王座戦の挑戦、開いたブラウザの延べ）
        if: inputs.what == '遊び方の内訳'
        run: |
          npx wrangler d1 execute hyakka-kenten --remote --json --command "SELECT strftime('%Y-%W', day) AS wk, SUM(CASE WHEN ev = 'play' THEN n END) AS n, SUM(CASE WHEN ev = 'play' AND k = 't' THEN n END) AS t, SUM(CASE WHEN ev = 'play' AND k = 'm' THEN n END) AS m, SUM(CASE WHEN ev = 'play' AND k = 'f' THEN n END) AS f, SUM(CASE WHEN ev = 'play' AND k = 'd' THEN n END) AS d, SUM(CASE WHEN ev = 'reach' AND k = '1' THEN n END) AS players, SUM(CASE WHEN ev = 'visit' THEN n END) AS visits, SUM(CASE WHEN ev = 'visit' AND k = 'new' THEN n END) AS nw FROM daily_stats GROUP BY wk ORDER BY wk" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log('CHJSON'+JSON.stringify(JSON.parse(s)[0].results)))"
          npx wrangler d1 execute hyakka-kenten --remote --json --command "SELECT strftime('%Y-%W', datetime(at, '+9 hours')) AS wk, COUNT(*) AS ch FROM challenges WHERE result <> 'late' AND at >= '2026-10-20' GROUP BY wk ORDER BY wk" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log('CHJSON'+JSON.stringify(JSON.parse(s)[0].results)))"
      - name: アクセス解析（日ごとの合計から。来訪・初めて・また来た・スマホ・遊んだ人の節目、来た元ごと、入口ごと）
        if: inputs.what == 'アクセス解析'
        run: |
          npx wrangler d1 execute hyakka-kenten --remote --json --command "SELECT day, SUM(CASE WHEN ev = 'visit' THEN n END) AS v, SUM(CASE WHEN ev = 'visit' AND k = 'new' THEN n END) AS nw, SUM(CASE WHEN ev = 'visit' AND k = 'd1' THEN n END) AS d1, SUM(CASE WHEN ev = 'visit' AND k = 'w' THEN n END) AS w, SUM(CASE WHEN ev = 'visit' AND dev = 'm' THEN n END) AS mob, SUM(CASE WHEN ev = 'reach' AND k = '1' THEN n END) AS p1, SUM(CASE WHEN ev = 'reach' AND k = '2' THEN n END) AS p2, SUM(CASE WHEN ev = 'reach' AND k = '4' THEN n END) AS p4, SUM(CASE WHEN ev = 'reach' AND k = '10' THEN n END) AS p10, SUM(CASE WHEN ev = 'play' THEN n END) AS plays FROM daily_stats GROUP BY day ORDER BY day" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log('CHJSON'+JSON.stringify(JSON.parse(s)[0].results)))"
          npx wrangler d1 execute hyakka-kenten --remote --json --command "SELECT src, dev, SUM(CASE WHEN ev = 'visit' THEN n END) AS v, SUM(CASE WHEN ev = 'visit' AND k = 'new' THEN n END) AS nw, SUM(CASE WHEN ev = 'reach' AND k = '1' THEN n END) AS played, SUM(CASE WHEN ev = 'reach' AND k = '4' THEN n END) AS p4 FROM daily_stats WHERE ev IN ('visit', 'reach') GROUP BY src, dev ORDER BY v DESC" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log('CHJSON'+JSON.stringify(JSON.parse(s)[0].results)))"
          npx wrangler d1 execute hyakka-kenten --remote --json --command "SELECT k AS ref, SUM(n) AS v FROM daily_stats WHERE ev = 'ref' GROUP BY k ORDER BY v DESC LIMIT 25" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log('CHJSON'+JSON.stringify(JSON.parse(s)[0].results)))"
          npx wrangler d1 execute hyakka-kenten --remote --json --command "SELECT x AS land, SUM(n) AS v FROM daily_stats WHERE ev = 'visit' GROUP BY x ORDER BY v DESC" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log('CHJSON'+JSON.stringify(JSON.parse(s)[0].results)))"
      - name: 今日の記録（日本時間の今日の日ごとの合計。誰のものかは持たない）
        if: inputs.what == '今日の記録'
        run: |
          npx wrangler d1 execute hyakka-kenten --remote --json --command "SELECT ev, k, dev, src, x, n FROM daily_stats WHERE day = date('now', '+9 hours') ORDER BY ev, k, dev, src" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log('CHJSON'+JSON.stringify(JSON.parse(s)[0].results)))"
      - name: 王座の交代（日本時間の日ごと・時間帯ごとの交代の回数と、王者の在位時間。名前などは出さない）
        if: inputs.what == '王座の交代'
        run: |
          npx wrangler d1 execute hyakka-kenten --remote --json --command "SELECT date(started_at, '+9 hours') AS day, COUNT(*) AS n, SUM(CASE WHEN (julianday(COALESCE(ended_at, datetime('now'))) - julianday(started_at)) * 24 < 1 THEN 1 ELSE 0 END) AS under1h FROM reigns GROUP BY day ORDER BY day; SELECT id, started_at, ended_at, defenses FROM reigns ORDER BY id DESC LIMIT 40" > /tmp/rg.json
          node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/rg.json','utf8'));console.log('CHJSON'+JSON.stringify(j.map(x=>x.results)))"
      - name: 王座戦の記録（挑戦者・王者・結果。名前などは出さない）
        if: inputs.what == '王座戦の記録'
        run: |
          npx wrangler d1 execute hyakka-kenten --remote --json --command "SELECT c.id, c.title AS ch, r.title AS champ, c.result FROM challenges c JOIN reigns r ON r.id = c.reign_id WHERE c.result <> 'late' ORDER BY c.id" > /tmp/ch.json
          node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/ch.json','utf8'));console.log('CHJSON'+JSON.stringify(j[0].results))"
      - name: 読み取りの多い問い合わせ（直近1日と7日。D1 が記録している、問い合わせごとの読んだ行数）
        if: inputs.what == '読み取りの多い問い合わせ'
        run: |
          npx wrangler d1 insights hyakka-kenten --timePeriod=1d --sort-type=sum --sort-by=reads --limit=15 --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log('CHJSON'+JSON.stringify(j.map(x=>({q:x.query.slice(0,300),n:x.numberOfTimesRun,read:x.totalRowsRead,avg:x.avgRowsRead}))))})"
          npx wrangler d1 insights hyakka-kenten --timePeriod=7d --sort-type=sum --sort-by=reads --limit=15 --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log('CHJSON'+JSON.stringify(j.map(x=>({q:x.query.slice(0,300),n:x.numberOfTimesRun,read:x.totalRowsRead,avg:x.avgRowsRead}))))})"
      - name: 日ごとの合計の照合（今までの1件ずつの記録と、まとめた日ごとの合計が一致するか。日ごとに並べる）
        if: inputs.what == '日ごとの合計の照合'
        run: |
          npx wrangler d1 execute hyakka-kenten --remote --json --command "SELECT v.day, v.n AS visits, (SELECT SUM(n) FROM daily_stats d WHERE d.day = v.day AND d.ev = 'visit') AS sum_visit, v.nw AS fresh, (SELECT SUM(n) FROM daily_stats d WHERE d.day = v.day AND d.ev = 'visit' AND d.k = 'new') AS sum_new FROM (SELECT day, COUNT(*) AS n, SUM(fresh) AS nw FROM visits GROUP BY day) v ORDER BY v.day" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log('CHJSON'+JSON.stringify(JSON.parse(s)[0].results)))"
          npx wrangler d1 execute hyakka-kenten --remote --json --command "SELECT p.day, p.n AS plays, (SELECT SUM(n) FROM daily_stats d WHERE d.day = p.day AND d.ev = 'play') AS sum_play, p.t, (SELECT SUM(n) FROM daily_stats d WHERE d.day = p.day AND d.ev = 'play' AND d.k = 't') AS sum_t, p.who AS players, (SELECT SUM(n) FROM daily_stats d WHERE d.day = p.day AND d.ev = 'reach' AND d.k = '1') AS sum_reach1 FROM (SELECT date(datetime(at, '+9 hours')) AS day, SUM(n) AS n, SUM(COALESCE(kt, 0)) AS t, COUNT(DISTINCT COALESCE(client, 'ip:' || iphash)) AS who FROM plays GROUP BY day) p ORDER BY p.day" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log('CHJSON'+JSON.stringify(JSON.parse(s)[0].results)))"
      - name: 来た元の推移（日ごと・来た元ごとの来訪と、遊んだ人。日ごとの合計から）
        if: inputs.what == '来た元の推移'
        run: |
          npx wrangler d1 execute hyakka-kenten --remote --json --command "SELECT day, src, SUM(CASE WHEN ev = 'visit' THEN n END) AS v, SUM(CASE WHEN ev = 'visit' AND k = 'new' THEN n END) AS nw, SUM(CASE WHEN ev = 'reach' AND k = '1' THEN n END) AS played FROM daily_stats WHERE day >= date('now', '+9 hours', '-14 days') AND ev IN ('visit', 'reach') GROUP BY day, src ORDER BY day, src" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log('CHJSON'+JSON.stringify(JSON.parse(s)[0].results)))"
