# 調査用：tools/check/ のスクリプトを1つ動かして、結果を実行結果ページ（Summary）に出す。手動でだけ動く
name: 調査
on:
  workflow_dispatch:
    inputs:
      script:
        description: tools/check/ の中のスクリプト名
        required: true
      n:
        description: 試しに動かすときの件数（空なら全部。使うスクリプトだけが見る）
        required: false
      offset:
        description: 試しに動かすときの開始位置（空なら最初から。使うスクリプトだけが見る）
        required: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 調査を動かす
        env:
          SCRIPT: ${{ inputs.script }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_ID: ${{ vars.D1_DATABASE_ID }}
          N: ${{ inputs.n }}
          OFFSET: ${{ inputs.offset }}
        run: |
          case "$SCRIPT" in *[!A-Za-z0-9_.-]*|"") echo "スクリプト名が不正です"; exit 1;; esac
          node "tools/check/$SCRIPT"
      - name: 結果のファイルを残す（あれば）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-out
          path: |
            numcheck.json
          if-no-files-found: ignore
