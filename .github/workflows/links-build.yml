# 百科ダンジョンのリンクのつながりを作る：検索用データ（jawiki_content）から記事ごとのリンク先を取り、収録している記事どうしのつながり（上限なし）と、毎日のお題を作る
#   できたもの（data/l の1,024個と data/dg の月ごとのお題）は、Git に入れず GitHub の Releases（タグ links-日付）に links.tar として置く。デプロイのときにそこから取り出して配る
#   記事データを作り直したとき（data/t が変わったとき）は、これも作り直すこと（記事の番号が data/t の並び順のため）
#   お題は今日から DAYS 日分。足りなくなる前に作り直す
name: 作り直し：ダンジョンのリンクのつながり
on:
  workflow_dispatch:
    inputs:
      date:
        description: ダンプの日付（YYYYMMDD。空なら最新）
        default: ''
      limit:
        description: 試しに動かすときの区画の数（空なら全部）
        default: ''
      days:
        description: お題を作る日数
        default: '180'
      release:
        description: Releases に置く（試すときは外す）
        type: boolean
        default: true
permissions:
  contents: write
  actions: read
jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.l.outputs.shards }}
      base: ${{ steps.l.outputs.base }}
    steps:
      - id: l
        env:
          DATE: ${{ inputs.date }}
          LIMIT: ${{ inputs.limit }}
        run: |
          UA='hyakka-kenten data rebuild (https://github.com/y-krn)'
          top=https://dumps.wikimedia.org/other/cirrus_search_index
          d=${DATE:-$(curl -sS -A "$UA" $top/ | grep -o 'href="[0-9]\{8\}/"' | grep -o '[0-9]\{8\}' | sort | tail -1)}
          base="$top/$d/index_name=jawiki_content"
          files=$(curl -sS -A "$UA" "$base/" | grep -o 'jawiki_content-[0-9]*-[0-9]*\.json\.bz2' | sort -u)
          [ -n "$LIMIT" ] && files=$(echo "$files" | head -n "$LIMIT")
          echo "日付 $d、区画 $(echo "$files" | wc -l)"
          echo "base=$base" >> $GITHUB_OUTPUT
          echo "shards=$(echo "$files" | python3 -c 'import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')" >> $GITHUB_OUTPUT
  extract:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.list.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - name: 取り出す
        run: |
          sudo apt-get install -y -qq lbzip2 >/dev/null
          n=$(echo "${{ matrix.shard }}" | grep -o '[0-9]*\.json' | grep -o '[0-9]*')
          mkdir -p out
          curl -sS --retry 5 -A 'hyakka-kenten data rebuild (https://github.com/y-krn)' "${{ needs.list.outputs.base }}/${{ matrix.shard }}" \
            | lbzip2 -dc | python3 tools/links_extract.py out/links_$n.tsv out/red_$n.tsv
          gzip -6 out/*.tsv && ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: links-${{ strategy.job-index }}
          path: out
          retention-days: 2
          compression-level: 0
  build:
    needs: extract
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            data
      - uses: actions/download-artifact@v4
        with:
          pattern: links-*
          merge-multiple: true
          path: all
      - run: pip install -q numpy
      - name: つながりとお題を作る
        env:
          DAYS: ${{ inputs.days }}
        run: du -sh all && python3 tools/links_build.py all out && du -sh out/l out/dg && ls out/dg
      - name: まとめる
        run: tar -C out -cf links.tar l dg && ls -la links.tar
      - name: Releases に置く
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=links-$(date -u +%Y%m%d%H%M)
          gh release create "$tag" links.tar -R ${{ github.repository }} --title "ダンジョンのリンクのつながり $tag" --notes "百科ダンジョン用（data/l と data/dg）。デプロイのときに取り出して配る。Git には入れない。" --latest=false
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.release }}
        with:
          name: links-built
          path: links.tar
          retention-days: 3
          compression-level: 0
