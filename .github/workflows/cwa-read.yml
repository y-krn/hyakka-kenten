# Cloudflare Web Analytics を読むだけ（何も変えない）：表示のずれ（CLS）の内訳を、実行ログに出す
name: アクセス解析を読む（確認用）
on:
  workflow_dispatch:
    inputs:
      days:
        description: 何日分か
        default: '7'
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/cwa
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/cwa/cls.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DAYS: ${{ inputs.days }}
