# 王座戦の試合ごとの共有画像を作って、サーバーに預ける
#  - 挑戦が記録されると、サーバー（Worker）がこのワークフローを呼ぶ（GH_DISPATCH_TOKEN を設定したとき）
#  - 取りこぼしは1時間ごとの定期実行で拾う
#  必要な設定: Secrets の ADMIN_TOKEN（デプロイで使っているものと同じ）
name: 共有画像を作る
run-name: ${{ github.event_name == 'repository_dispatch' && format('共有画像 挑戦#{0}（{1}送信）', github.event.client_payload.id, github.event.client_payload.sent) || '共有画像を作る' }}
on:
  repository_dispatch:
    types: [og]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      ask:
        description: 試験：サーバーから画像作りの呼び出しを1回だけ送らせる（画像は作らない）
        type: boolean
        default: false
concurrency:
  group: og-${{ github.event_name == 'workflow_dispatch' && inputs.ask && 'ask' || 'render' }}
  cancel-in-progress: false
jobs:
  ask:
    if: github.event_name == 'workflow_dispatch' && inputs.ask
    runs-on: ubuntu-latest
    steps:
      - run: 'curl -sS -X POST -H "Authorization: Bearer $ADMIN_TOKEN" https://hyakkakenten.com/api/og/ask'
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
  render:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.ask) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/og
            icon-512.png
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/og/package-lock.json
      - run: npm ci
        working-directory: tools/og
      - name: 画像を作って預ける
        working-directory: tools/og
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          TZ: Asia/Tokyo
        run: node render.mjs
