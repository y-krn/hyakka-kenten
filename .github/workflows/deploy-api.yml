# ゲーム（画面・記事データ）と王座戦API を、まとめて Cloudflare Workers にデプロイする（https://hyakkakenten.com）
# 必要な設定（リポジトリの Settings → Secrets and variables → Actions）
#   Secrets  : CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, ADMIN_TOKEN, IP_SALT（任意: GH_DISPATCH_TOKEN … 挑戦のたびに共有画像を作らせる）
#   Variables: D1_DATABASE_ID
name: サイトとAPIのデプロイ
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['worker/**', 'index.html', 'data/**', 'data.lock', '*.png', '*.ico', '*.webmanifest', 'robots.txt', 'sitemap.xml', '.github/workflows/deploy-api.yml']
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ vars.D1_DATABASE_ID != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: D1のIDを設定
        run: sed -i "s/REPLACE_WITH_D1_DATABASE_ID/${{ vars.D1_DATABASE_ID }}/" wrangler.toml
      - name: 表を作る（すでにあれば何もしない）
        run: npx wrangler d1 execute hyakka-kenten --remote --file schema.sql
      - name: 列の追加（すでにあれば何もしない）
        run: npx wrangler d1 execute hyakka-kenten --remote --file migrate.sql || true
      - name: 索引
        run: npx wrangler d1 execute hyakka-kenten --remote --command "CREATE INDEX IF NOT EXISTS ch_client ON challenges(client, at)"
      - name: 配るファイルを public/ に集める
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p public
          cp ../index.html ../privacy.html ../*.webmanifest ../robots.txt ../sitemap.xml ../*.png ../favicon.ico public/
          # 記事データ：data.lock に包みの名前（Releases の data-…）が書いてあれば、その包みを取り出して配る。なければ Git の data/ を配る（移行前）
          if [ -s ../data.lock ]; then
            tag=$(head -1 ../data.lock | tr -d '[:space:]')
            gh release download "$tag" -R ${{ github.repository }} -p data.tar -D /tmp/pk && tar -C public -xf /tmp/pk/data.tar
            test -f public/data/manifest.json && echo "包み $tag を配る（$(find public/data -type f | wc -l) ファイル）"
            # 画面が遊ぶときに読む手で直す表は、Git のものを上に重ねる（直したらすぐ届く。索引に関わる unhold.json などは、包みを作り直す）
            for f in exclude.json fix.json movedex.json playerdex.json fixa pref; do [ -e ../data/$f ] && cp -r ../data/$f public/data/; done
          else
            cp -r ../data public/data
          fi
      - name: デプロイ
        run: npx wrangler deploy
      - name: 秘密の値を設定
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          IP_SALT: ${{ secrets.IP_SALT }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          echo "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN
          echo "$IP_SALT" | npx wrangler secret put IP_SALT
          if [ -n "$GH_DISPATCH_TOKEN" ]; then echo "$GH_DISPATCH_TOKEN" | npx wrangler secret put GH_DISPATCH_TOKEN; fi
          if [ -n "$NTFY_TOPIC" ]; then echo "$NTFY_TOPIC" | npx wrangler secret put NTFY_TOPIC; fi   # 利用者からの報告を管理者に届ける
