# 王座戦API（Cloudflare Workers + D1）を自動でデプロイする
# 必要な設定（リポジトリの Settings → Secrets and variables → Actions）
#   Secrets  : CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, ADMIN_TOKEN, IP_SALT
#   Variables: D1_DATABASE_ID
name: 王座戦APIのデプロイ
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-api.yml']
jobs:
  deploy:
    if: ${{ vars.D1_DATABASE_ID != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: D1のIDを設定
        run: sed -i "s/REPLACE_WITH_D1_DATABASE_ID/${{ vars.D1_DATABASE_ID }}/" wrangler.toml
      - name: 表を作る（すでにあれば何もしない）
        run: npx wrangler d1 execute hyakka-kenten --remote --file schema.sql
      - name: デプロイ
        run: npx wrangler deploy
      - name: 秘密の値を設定
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          IP_SALT: ${{ secrets.IP_SALT }}
        run: |
          echo "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN
          echo "$IP_SALT" | npx wrangler secret put IP_SALT
