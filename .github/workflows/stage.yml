# 「この辺が舞台の作品」の索引（data/st）を作り直して、指定したブランチに入れる
#   日本語版Wikipediaのカテゴリをたどるので、20分ほどかかる。手動で実行する
#   入れたあとは、preview ならプレビュー版を、main なら本番を上げ直す
name: 舞台の索引を作る
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 入れるブランチ（preview / main）
        default: preview
permissions:
  contents: write
  actions: write
concurrency:
  group: stage
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 索引を作る
        run: node tools/build_stage.mjs
      - name: ブランチに入れる
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/st
          git diff --cached --quiet && { echo "変更なし"; exit 0; }
          git commit -m "舞台の索引を更新"
          git push origin HEAD:${{ inputs.branch }}
      - name: 上げ直す
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.branch }}" = main ]; then gh workflow run deploy-api.yml --ref main -R ${{ github.repository }} || true
          else gh workflow run preview.yml --ref preview -R ${{ github.repository }}; fi
