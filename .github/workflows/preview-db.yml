# プレビュー版専用のデータベース（D1「hyakka-kenten-preview」）を用意・初期化する（手動で動かす）
#   プレビュー版は本番と別のデータベースを使うので、王座戦などをプレビューで気兼ねなく試せる
#   ・作る：データベースを作り、ID を表示する（1回だけ）
#   ・初期化：preview ブランチの schema.sql で表を作り直す（中身は消える）
name: プレビュー用データベース
on:
  workflow_dispatch:
    inputs:
      what:
        description: 何をするか
        type: choice
        options: [作る, 初期化]
jobs:
  db:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      PREVIEW_DB: 4ad2e00e-41a9-4c25-926e-e068a61c78a3   # プレビュー用データベースのID（秘密ではない）
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: 作る
        if: inputs.what == '作る'
        run: |
          npx wrangler d1 create hyakka-kenten-preview 2>&1 | tee /tmp/out.txt
          grep -n "database_id" /tmp/out.txt || true
      - name: プレビュー用のIDを設定
        if: inputs.what != '作る'
        run: |
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/${{ env.PREVIEW_DB }}/; s/database_name = \"hyakka-kenten\"/database_name = \"hyakka-kenten-preview\"/" wrangler.toml
          grep -n "database" wrangler.toml
      - name: 初期化
        if: inputs.what == '初期化'
        run: |
          npx wrangler d1 execute hyakka-kenten-preview --remote --command "SELECT name FROM sqlite_master WHERE type='table'" --json | node -e "const j=JSON.parse(require('fs').readFileSync(0,'utf8'));const t=j[0].results.map(x=>x.name).filter(n=>!n.startsWith('_')&&!n.startsWith('sqlite'));console.log(t.map(n=>'DROP TABLE IF EXISTS '+n+';').join('\n'))" > /tmp/drop.sql
          cat /tmp/drop.sql; test -s /tmp/drop.sql && npx wrangler d1 execute hyakka-kenten-preview --remote --file /tmp/drop.sql || true
          npx wrangler d1 execute hyakka-kenten-preview --remote --file schema.sql
          npx wrangler d1 execute hyakka-kenten-preview --remote --command "ALTER TABLE visits ADD COLUMN land TEXT" || true   # 本番では fixes で足した列
